name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,examples,bo]"

      - name: Lint
        run: python -m ruff check matgpr tests scripts

      - name: Check formatting
        run: python -m ruff format --check matgpr tests scripts

      - name: Test
        run: python -m pytest --cov=matgpr --cov-report=term-missing

      - name: Build package
        run: python -m build

  minimum-dependencies:
    name: Minimum supported dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      # Installs the exact lower bounds declared in pyproject.toml, so those
      # bounds stay a tested claim rather than an assumption. Raise a pin here
      # and in pyproject.toml together.
      - name: Install package at the declared lower bounds
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,bo]" \
            "botorch==0.16.*" \
            "gpytorch==1.15.*" \
            "joblib==1.2.*" \
            "matplotlib==3.7.*" \
            "numpy==1.23.*" \
            "pandas==2.0.*" \
            "pymatgen==2023.9.*" \
            "rdkit==2023.3.*" \
            "scikit-learn==1.6.*" \
            "scipy==1.9.*" \
            "torch==2.1.*"

      - name: Report resolved versions
        run: python -m pip list

      - name: Test
        run: python -m pytest

  notebook-smoke:
    name: Notebook smoke checks
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,examples]"

      - name: Execute reduced notebook smoke tests
        run: python scripts/smoke_notebooks.py
