name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  package-quality:
    name: Package quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package-quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build ruff twine

      - name: Lint
        run: python -m ruff check matgpr tests scripts

      - name: Check formatting
        run: python -m ruff format --check matgpr tests scripts

      - name: Build package
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Smoke-test installed wheel
        run: |
          python -m venv "${RUNNER_TEMP}/matgpr-wheel-smoke"
          "${RUNNER_TEMP}/matgpr-wheel-smoke/bin/python" -m pip install \
            --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/matgpr-wheel-smoke/bin/python" -I \
            "${GITHUB_WORKSPACE}/scripts/smoke_wheel_install.py"

  mcp-smoke:
    name: MCP integration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package with MCP support
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[mcp]"
          python -m pip check

      - name: Run packaged MCP client/server smoke
        run: >-
          matgpr-mcp-smoke
          --command "$(command -v matgpr-mcp)"
          --json

  canonical-tests:
    name: Tests (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run full test suite with branch coverage
        run: >-
          python -m pytest
          --cov=matgpr
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=79

  tests:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit and contract compatibility tests
        run: python -m pytest -m "unit or contract"

  minimum-dependencies:
    name: Minimum supported dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      # Installs the exact lower bounds declared in pyproject.toml, so those
      # bounds stay a tested claim rather than an assumption. Raise a pin here
      # and in pyproject.toml together.
      - name: Install package at the declared lower bounds
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" \
            "botorch==0.16.*" \
            "gpytorch==1.15.*" \
            "joblib==1.2.*" \
            "matplotlib==3.7.*" \
            "numpy==1.23.*" \
            "pandas==2.0.*" \
            "pymatgen==2023.9.*" \
            "rdkit==2023.3.*" \
            "scikit-learn==1.6.*" \
            "scipy==1.9.*" \
            "torch==2.1.*"

      - name: Report resolved versions
        run: python -m pip list

      - name: Test
        run: python -m pytest

  notebook-smoke:
    name: Notebook smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [canonical-tests, package-quality]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,examples]"

      - name: Execute reduced notebook smoke tests
        run: python scripts/smoke_notebooks.py
