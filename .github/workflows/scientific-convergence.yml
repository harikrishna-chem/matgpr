name: Scientific convergence

on:
  schedule:
    - cron: "23 17 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matgpr-scientific-convergence
  cancel-in-progress: false

jobs:
  pi-gpr-convergence:
    name: PI-GPR convergence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip check

      - name: Run PI-GPR scientific convergence
        run: python scripts/check_pi_gpr_convergence.py
