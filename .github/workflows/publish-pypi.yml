name: Publish Python Package

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Package index to publish to"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi
      version:
        description: "Expected matgpr version"
        required: true
        default: "0.2.0"

permissions:
  contents: read

concurrency:
  group: publish-python-package-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify release version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          PUBLISH_TARGET: ${{ inputs.target }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import pathlib
          import sys
          import tomllib

          expected = os.environ["EXPECTED_VERSION"]
          target = os.environ["PUBLISH_TARGET"]
          ref_name = os.environ["REF_NAME"]

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = pyproject["project"]["version"]
          version_file = pathlib.Path("matgpr/_version.py").read_text()
          citation = pathlib.Path("CITATION.cff").read_text()

          mismatches = []
          if version != expected:
              mismatches.append(f"pyproject version {version!r} != expected {expected!r}")
          if f'__version__ = "{version}"' not in version_file:
              mismatches.append("matgpr/_version.py does not match pyproject version")
          if f'version: "{version}"' not in citation:
              mismatches.append("CITATION.cff does not match pyproject version")
          if target == "pypi" and ref_name != f"v{version}":
              mismatches.append(
                  f"live PyPI publish must run from tag v{version}; got {ref_name!r}"
              )

          if mismatches:
              for mismatch in mismatches:
                  print(f"ERROR: {mismatch}", file=sys.stderr)
              raise SystemExit(1)

          print(f"Release metadata verified for matgpr {version} on target {target}.")
          PY

      - name: Build package
        run: |
          rm -rf dist build matgpr.egg-info
          python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: ${{ inputs.target == 'testpypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/matgpr
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: ${{ inputs.target == 'pypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/matgpr
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
