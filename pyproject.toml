[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "matgpr"
version = "0.2.0"
description = "Gaussian Process Regression toolkit for materials informatics, including physics-informed mean functions."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Harikrishna Sahu", email = "harikrishnasahu89@gmail.com" },
]
maintainers = [
    { name = "Harikrishna Sahu", email = "harikrishnasahu89@gmail.com" },
]
keywords = [
    "bayesian-optimization",
    "gaussian-process",
    "materials-informatics",
    "physics-informed",
    "uncertainty",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
]
# Lower bounds are the oldest versions the test suite is known to pass on;
# see the "Minimum supported dependencies" CI job, which installs exactly
# these versions. gpytorch 1.15 is required for HadamardGaussianLikelihood
# and scikit-learn 1.6 for the ensure_all_finite validation argument.
# botorch below 0.16 pins gpytorch==1.14 exactly, which conflicts with that.
dependencies = [
    "botorch>=0.16",
    "gpytorch>=1.15",
    "joblib>=1.2",
    "matplotlib>=3.7",
    "numpy>=1.23",
    "pandas>=2.0",
    "pymatgen>=2023.9.10",
    "rdkit>=2023.3.1",
    "scikit-learn>=1.6",
    "scipy>=1.9",
    "torch>=2.1",
]

[project.urls]
Homepage = "https://github.com/harikrishna-chem/matgpr"
Documentation = "https://harikrishnasahu.com/matgpr/"
Repository = "https://github.com/harikrishna-chem/matgpr"
Issues = "https://github.com/harikrishna-chem/matgpr/issues"
Changelog = "https://github.com/harikrishna-chem/matgpr/blob/main/CHANGELOG.md"

[project.scripts]
matgpr-mcp = "matgpr.mcp_server:main"
matgpr-mcp-smoke = "matgpr.mcp_smoke:main"

[project.optional-dependencies]
# Retained so existing "matgpr[bo]" pins keep resolving; BoTorch is now a
# required dependency and this extra adds nothing.
bo = []
dev = [
    "build",
    "ipykernel",
    "nbconvert",
    "nbformat",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
]
examples = [
    "shap",
]
mcp = [
    "mcp[cli]",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]
materials-extra = [
    "matminer",
    "mendeleev",
]
structures = [
    "ase",
    "dscribe",
]
molecular-extra = [
    "mordredcommunity",
]
jarvis = [
    "jarvis-tools",
]
deep = [
    "deepchem",
]
all-fingerprints = [
    "ase",
    "deepchem",
    "dscribe",
    "jarvis-tools",
    "matminer",
    "mendeleev",
    "mordredcommunity",
]

[tool.setuptools.packages.find]
include = ["matgpr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "examples",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
ignore = [
    "E402",
    "E501",
]
